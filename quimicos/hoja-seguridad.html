<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#00467F" />
  <title>Hojas de Seguridad - Productos Químicos · COFCA</title>
  <link rel="stylesheet" href="../assets/style.css" />
</head>
<body>
  <header class="header">
    <div class="brand">
      <span class="brand-mark">📄</span>
      <span>COFCA · Hojas de Seguridad</span>
    </div>
    <h1 class="title">Productos Químicos</h1>
    <p class="subtitle">Selecciona el producto que necesitas consultar</p>
  </header>

  <main class="container">
    <div class="search-wrap">
      <input id="q" type="search" placeholder="Buscar producto…" autocomplete="off" />
    </div>

    <div id="lista"></div>

    <p id="vacio" class="list-empty" style="display:none;">
      No se encontraron productos para esa búsqueda.
    </p>

    <section class="section">
      <a href="index.html" class="card" style="background:transparent;border:1px dashed var(--cofca-border);box-shadow:none;">
        <span class="card-icon" style="background:transparent;color:var(--cofca-muted);box-shadow:none;font-size:22px;">‹</span>
        <div class="card-body">
          <div class="card-title" style="color:var(--cofca-muted);">Volver a Productos Químicos</div>
        </div>
      </a>
    </section>
  </main>

  <footer class="footer">
    <strong>COFCA</strong> · Sistema de Gestión SST
  </footer>

  <script>
    // Cada producto: [archivo, nombre legible]
    const productos = [
      ["1-thinner.pdf",                       "Thinner"],
      ["2-vasrsol.pdf",                       "Varsol"],
      ["3-aerosol.pdf",                       "Aerosol"],
      ["4-esmalte.pdf",                       "Esmalte"],
      ["5-poliuretano.pdf",                   "Poliuretano"],
      ["6-aceites-lubricantes.pdf",           "Aceites Lubricantes"],
      ["7-boxer.pdf",                         "Boxer"],
      ["8-pegante-tubos.pdf",                 "Pegante para Tubos"],
      ["9-hipoclorito.pdf",                   "Hipoclorito"],
      ["10-klaxinn.pdf",                      "Klaxinn"],
      ["11-alka-dds.pdf",                     "Alka DDS"],
      ["12-surfalkan.pdf",                    "Surfalkan"],
      ["13-pegante-sika.pdf",                 "Pegante Sika"],
      ["14-hs-r410a-es.pdf",                  "Refrigerante R-410A"],
      ["15-extintor-dioxido-de-carbono.pdf",  "Extintor Dióxido de Carbono"],
      ["16-acpm.pdf",                         "ACPM"],
      ["17-masilla-super-mastick.pdf",        "Masilla Super Mastick"],
      ["18-limpiador-desincrusante.pdf",      "Limpiador Desincrustante"],
      ["18-pegante-pvc.pdf",                  "Pegante PVC"],
      ["19-evav-clean.pdf",                   "EVAV Clean"],
      ["20-diablo-rojo.pdf",                  "Diablo Rojo"],
      ["21-quita-oxidos.pdf",                 "Quita Óxidos"],
      ["22-limpiador-desincrusante.pdf",      "Limpiador Desincrustante (2)"],
      ["23-alkazyme.pdf",                     "Alkazyme"],
      ["24-barniz-acrilico-spray.pdf",        "Barniz Acrílico Spray"],
      ["25-pintura-multiproposito.pdf",       "Pintura Multipropósito"],
      ["26-limpiador-electrico.pdf",          "Limpiador Eléctrico"],
      ["27-sika-impermeabilizante.pdf",       "Sika Impermeabilizante"],
      ["28-butano.pdf",                       "Butano"],
      ["29-silicona-pegavidrios.pdf",         "Silicona Pega Vidrios"],
      ["30-soda-caustica.pdf",                "Soda Cáustica"],
      ["31-hipoclorito-sodio.pdf",            "Hipoclorito de Sodio"],
      ["32-jabon-liquido.pdf",                "Jabón Líquido"],
      ["33-hipoclorito-13.pdf",               "Hipoclorito al 13%"],
      ["34-desinfectante.pdf",                "Desinfectante"],
    ];

    const lista = document.getElementById("lista");
    const vacio = document.getElementById("vacio");
    const q     = document.getElementById("q");

    function normalize(s) {
      return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
    }

    function pintar(filtro = "") {
      const f = normalize(filtro.trim());
      lista.innerHTML = "";
      let count = 0;

      productos.forEach(([archivo, nombre], i) => {
        if (f && !normalize(nombre).includes(f)) return;
        count++;

        const a = document.createElement("a");
        a.className = "list-item";
        a.href = `ver-pdf.html?f=${encodeURIComponent(archivo)}&t=${encodeURIComponent(nombre)}`;
        a.innerHTML = `
          <span class="list-item-num">${i + 1}</span>
          <div class="list-item-body">
            <div class="list-item-title">${nombre}</div>
            <div class="list-item-meta">Hoja de Seguridad · PDF</div>
          </div>
          <span class="list-item-arrow">›</span>
        `;
        lista.appendChild(a);
      });

      vacio.style.display = count === 0 ? "block" : "none";
    }

    q.addEventListener("input", e => pintar(e.target.value));
    pintar();
  </script>
</body>
</html>
