<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#00467F" />
  <title>Productos Químicos · SST COFCA</title>
  <meta name="description" content="Hojas de seguridad, resúmenes y videos de productos químicos - Clínica Oftalmológica del Caribe." />
  <link rel="stylesheet" href="../assets/style.css" />
</head>
<body>
  <header class="header">
    <div class="brand">
      <span class="brand-mark">🧪</span>
      <span>COFCA · SST</span>
    </div>
    <img src="../assets/mascota/iris.png" class="hero-mascota hero-mascota--sm" alt="Iris, mascota de COFCA" />
    <h1 class="title">Productos Químicos</h1>
    <p class="subtitle">Selecciona un producto para ver su información</p>
  </header>

  <main class="container">
    <div class="search-wrap">
      <input id="q" type="search" placeholder="Buscar producto…" autocomplete="off" />
    </div>

    <div id="lista"></div>

    <p id="vacio" class="list-empty" style="display:none;">
      No se encontraron productos para esa búsqueda.
    </p>
  </main>

  <footer class="footer">
    <strong>COFCA</strong> · Sistema de Gestión SST<br />
    Área de Productos Químicos
  </footer>

  <script src="datos.js"></script>
  <script>
    const lista = document.getElementById("lista");
    const vacio = document.getElementById("vacio");
    const q     = document.getElementById("q");

    function normalize(s) {
      return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
    }

    function pintar(filtro = "") {
      const f = normalize(filtro.trim());
      lista.innerHTML = "";
      let count = 0;

      PRODUCTOS.forEach((p, i) => {
        if (f && !normalize(p.nombre).includes(f)) return;
        count++;

        const a = document.createElement("a");
        a.className = "list-item";
        a.href = `producto.html?id=${encodeURIComponent(p.id)}`;
        const dot = p.severidad
          ? `<span class="sev-dot ${p.severidad}" title="Riesgo ${p.severidad}"></span>`
          : "";
        a.innerHTML = `
          <span class="list-item-num">${i + 1}</span>
          <div class="list-item-body">
            <div class="list-item-title">${p.nombre}</div>
            <div class="list-item-meta">${dot}EPP · Hoja · Resumen · Video</div>
          </div>
          <span class="list-item-arrow">›</span>
        `;
        lista.appendChild(a);
      });

      vacio.style.display = count === 0 ? "block" : "none";
    }

    q.addEventListener("input", e => pintar(e.target.value));
    pintar();
  </script>
</body>
</html>
