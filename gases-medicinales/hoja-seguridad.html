<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#00467F" />
  <title>Hojas de Seguridad - Gases Medicinales · COFCA</title>
  <link rel="stylesheet" href="../assets/style.css" />
</head>
<body>
  <header class="header">
    <div class="brand">
      <span class="brand-mark">📄</span>
      <span>COFCA · Hojas de Seguridad</span>
    </div>
    <h1 class="title">Gases Medicinales</h1>
    <p class="subtitle">Selecciona el gas que necesitas consultar</p>
  </header>

  <main class="container">
    <div class="search-wrap">
      <input id="q" type="search" placeholder="Buscar gas…" autocomplete="off" />
    </div>

    <div id="lista"></div>

    <p id="vacio" class="list-empty" style="display:none;">
      No se encontraron gases para esa búsqueda.
    </p>

    <section class="section">
      <a href="index.html" class="card" style="background:transparent;border:1px dashed var(--cofca-border);box-shadow:none;">
        <span class="card-icon" style="background:transparent;color:var(--cofca-muted);box-shadow:none;font-size:22px;">‹</span>
        <div class="card-body">
          <div class="card-title" style="color:var(--cofca-muted);">Volver a Gases Medicinales</div>
        </div>
      </a>
    </section>
  </main>

  <footer class="footer">
    <strong>COFCA</strong> · Sistema de Gestión SST
  </footer>

  <script>
    // Cada gas: [archivo, nombre legible]
    const productos = [
      ["aire-medicinal.pdf",     "Aire Medicinal Sintético Comprimido"],
      ["dioxido-de-carbono.pdf", "Dióxido de Carbono Medicinal"],
      ["oxido-nitroso.pdf",      "Óxido Nitroso"],
      ["oxigeno-liquido.pdf",    "Oxígeno Líquido (LOX)"],
      ["oxigeno-medicinal.pdf",  "Oxígeno Medicinal (GOX)"],
    ];

    const lista = document.getElementById("lista");
    const vacio = document.getElementById("vacio");
    const q     = document.getElementById("q");

    function normalize(s) {
      return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
    }

    function pintar(filtro = "") {
      const f = normalize(filtro.trim());
      lista.innerHTML = "";
      let count = 0;

      productos.forEach(([archivo, nombre], i) => {
        if (f && !normalize(nombre).includes(f)) return;
        count++;

        const a = document.createElement("a");
        a.className = "list-item";
        a.href = `ver-pdf.html?f=${encodeURIComponent(archivo)}&t=${encodeURIComponent(nombre)}`;
        a.innerHTML = `
          <span class="list-item-num">${i + 1}</span>
          <div class="list-item-body">
            <div class="list-item-title">${nombre}</div>
            <div class="list-item-meta">Ficha de Datos de Seguridad · PDF</div>
          </div>
          <span class="list-item-arrow">›</span>
        `;
        lista.appendChild(a);
      });

      vacio.style.display = count === 0 ? "block" : "none";
    }

    q.addEventListener("input", e => pintar(e.target.value));
    pintar();
  </script>
</body>
</html>
