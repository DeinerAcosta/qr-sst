<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#00467F" />
  <title>Resumen · SST COFCA</title>
  <link rel="stylesheet" href="../assets/style.css" />
</head>
<body>
  <header class="viewer-header">
    <a id="volver" href="index.html" class="back-btn" aria-label="Volver">‹</a>
    <div class="viewer-title" id="titulo">Resumen</div>
  </header>

  <main class="viewer-content">
    <article class="resumen" id="contenido"></article>
  </main>

  <script src="datos.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get("id");
    const producto = PRODUCTOS.find(p => p.id === id);
    const contenido = document.getElementById("contenido");

    if (producto) {
      document.getElementById("titulo").textContent = "Resumen · " + producto.nombre;
      document.title = `Resumen · ${producto.nombre} · COFCA`;
      document.getElementById("volver").href = `producto.html?id=${encodeURIComponent(producto.id)}`;

      if (producto.resumen && producto.resumen.trim() !== "") {
        contenido.innerHTML = producto.resumen;
      } else {
        contenido.innerHTML = `
          <h2>${producto.nombre}</h2>
          <div class="callout info">
            <strong>Resumen en preparación.</strong><br />
            El resumen de seguridad de este gas aún no ha sido cargado.
            Por ahora puedes consultar la <strong>Hoja de Seguridad (SDS)</strong> completa
            desde la pantalla anterior.
          </div>
          <p style="text-align:center;margin-top:24px;">
            <a class="btn" href="ver-pdf.html?id=${encodeURIComponent(producto.id)}">Ver Hoja de Seguridad</a>
          </p>`;
      }
    } else {
      document.getElementById("titulo").textContent = "Resumen";
      contenido.innerHTML = `
        <div class="callout danger">
          <strong>Gas no encontrado.</strong><br />
          Vuelve a la lista y selecciona un gas.
        </div>
        <p style="text-align:center;margin-top:24px;">
          <a class="btn" href="index.html">Volver a la lista</a>
        </p>`;
    }
  </script>
</body>
</html>
